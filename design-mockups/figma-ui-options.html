<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>小程序 UI 设计方向</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #eef1f4;
      color: #172026;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    .board { width: 1920px; padding: 42px; }
    .intro { margin-bottom: 30px; }
    .intro h1 { margin: 0 0 8px; font-size: 34px; letter-spacing: 0; }
    .intro p { margin: 0; color: #66727c; font-size: 16px; }
    .concept {
      margin-bottom: 44px;
      padding: 24px;
      border-radius: 28px;
      background: #fff;
      box-shadow: 0 18px 48px rgba(22, 32, 43, .1);
    }
    .concept-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 20px;
    }
    .concept-title { display: flex; align-items: center; gap: 14px; }
    .mark {
      width: 44px;
      height: 44px;
      border-radius: 15px;
      background: var(--accent);
      box-shadow: 0 10px 26px color-mix(in srgb, var(--accent), transparent 64%);
    }
    h2 { margin: 0; font-size: 26px; letter-spacing: 0; }
    .concept-desc { margin: 4px 0 0; color: #65717a; font-size: 14px; }
    .palette { display: flex; gap: 8px; }
    .swatch { width: 30px; height: 30px; border-radius: 50%; border: 1px solid rgba(0,0,0,.08); }
    .screens {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
    }
    .phone {
      width: 430px;
      height: 760px;
      border-radius: 38px;
      border: 9px solid #111820;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      box-shadow: 0 18px 44px rgba(14, 20, 26, .2);
      position: relative;
    }
    .screen {
      height: 100%;
      padding: 22px 18px 76px;
      background:
        radial-gradient(circle at 85% 5%, color-mix(in srgb, var(--accent), transparent 72%), transparent 30%),
        linear-gradient(180deg, var(--bgTop), var(--bg));
      overflow: hidden;
    }
    .status {
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 22px;
      margin-bottom: 14px;
      font-size: 12px;
      font-weight: 800;
      opacity: .78;
    }
    .screen-name {
      display: inline-flex;
      align-items: center;
      height: 28px;
      padding: 0 10px;
      border-radius: 999px;
      color: var(--onHero);
      background: color-mix(in srgb, var(--hero), transparent 10%);
      font-size: 12px;
      font-weight: 850;
      margin-bottom: 10px;
    }
    .hero {
      position: relative;
      overflow: hidden;
      border-radius: 26px;
      padding: 20px;
      background:
        radial-gradient(circle at 86% 20%, color-mix(in srgb, var(--accent), transparent 58%), transparent 34%),
        linear-gradient(135deg, var(--hero), var(--hero2));
      color: var(--onHero);
      box-shadow: 0 20px 42px color-mix(in srgb, var(--hero), transparent 72%);
      margin-bottom: 13px;
    }
    .hero:after {
      content: "";
      position: absolute;
      left: 22px;
      right: 22px;
      top: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--accent), white 20%), transparent);
      opacity: .7;
    }
    .eyebrow {
      display: block;
      font-size: 11px;
      letter-spacing: 1.6px;
      text-transform: uppercase;
      opacity: .68;
      font-weight: 900;
      margin-bottom: 8px;
    }
    .h1 {
      display: block;
      font-size: 28px;
      line-height: 1.12;
      font-weight: 950;
      letter-spacing: 0;
      margin-bottom: 8px;
    }
    .copy {
      display: block;
      font-size: 13px;
      line-height: 1.55;
      opacity: .72;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 9px;
      margin-top: 16px;
    }
    .stat, .card, .item, .input {
      background: var(--card);
      border: 1px solid var(--border);
      box-shadow: inset 0 1px rgba(255,255,255,.25), 0 10px 26px rgba(20, 28, 36, .05);
    }
    .stat {
      min-height: 76px;
      border-radius: 17px;
      padding: 11px 10px;
      color: var(--text);
    }
    .stat label, .label {
      display: block;
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
      margin-bottom: 6px;
    }
    .stat strong {
      display: block;
      color: var(--strong);
      font-size: 23px;
      line-height: 1;
      font-weight: 950;
    }
    .stat span {
      display: block;
      color: var(--muted);
      font-size: 10px;
      margin-top: 7px;
      line-height: 1.2;
    }
    .card {
      border-radius: 22px;
      padding: 16px;
      margin-top: 12px;
    }
    .card-head {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: flex-start;
      margin-bottom: 12px;
    }
    .h2 {
      display: block;
      color: var(--text);
      font-size: 18px;
      font-weight: 920;
      line-height: 1.2;
    }
    .muted {
      display: block;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
      margin-top: 4px;
    }
    .chip-row { display: flex; gap: 6px; flex-wrap: wrap; }
    .chip {
      display: inline-flex;
      align-items: center;
      height: 25px;
      padding: 0 10px;
      border-radius: 999px;
      background: var(--chip);
      color: var(--chipText);
      font-size: 11px;
      font-weight: 850;
      white-space: nowrap;
    }
    .two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .item {
      border-radius: 16px;
      padding: 12px;
      min-height: 70px;
    }
    .item strong {
      display: block;
      color: var(--text);
      font-size: 16px;
      line-height: 1.25;
      font-weight: 900;
    }
    .input {
      border-radius: 18px;
      padding: 13px;
      min-height: 76px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }
    .button {
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 11px;
      border-radius: 15px;
      background: linear-gradient(135deg, var(--accent), var(--button2));
      color: var(--buttonText);
      font-size: 14px;
      font-weight: 920;
      box-shadow: 0 12px 24px color-mix(in srgb, var(--accent), transparent 72%);
    }
    .timeline { display: flex; flex-direction: column; gap: 10px; }
    .event {
      display: grid;
      grid-template-columns: 54px 14px 1fr;
      gap: 10px;
      align-items: start;
    }
    .time {
      padding-top: 4px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 850;
      line-height: 1.35;
      text-align: right;
    }
    .axis {
      position: relative;
      height: 100%;
      min-height: 68px;
    }
    .axis:before {
      content: "";
      position: absolute;
      top: 14px;
      bottom: -22px;
      left: 6px;
      width: 2px;
      border-radius: 99px;
      background: var(--borderStrong);
    }
    .axis:after {
      content: "";
      position: absolute;
      left: 1px;
      top: 7px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 5px color-mix(in srgb, var(--accent), transparent 78%);
    }
    .event-card {
      min-height: 64px;
      padding: 12px;
      border-radius: 16px;
      background: var(--card2);
      border: 1px solid var(--border);
    }
    .event-title {
      display: block;
      color: var(--text);
      font-size: 13px;
      font-weight: 900;
      line-height: 1.35;
    }
    .event-desc {
      display: block;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.45;
      margin-top: 5px;
    }
    .profile {
      display: flex;
      gap: 13px;
      align-items: center;
      margin-bottom: 12px;
    }
    .avatar {
      width: 58px;
      height: 58px;
      border-radius: 22px;
      background: linear-gradient(135deg, var(--accent), var(--button2));
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--buttonText);
      font-size: 22px;
      font-weight: 950;
      box-shadow: 0 12px 28px color-mix(in srgb, var(--accent), transparent 72%);
    }
    .rows { display: flex; flex-direction: column; gap: 9px; }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 52px;
      padding: 0 13px;
      border-radius: 16px;
      background: var(--card2);
      border: 1px solid var(--border);
    }
    .row span { font-size: 13px; font-weight: 850; }
    .row b { color: var(--muted); font-size: 12px; }
    .tabbar {
      position: absolute;
      left: 16px;
      right: 16px;
      bottom: 13px;
      height: 56px;
      border-radius: 22px;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      padding: 5px;
      background: var(--nav);
      border: 1px solid var(--border);
      backdrop-filter: blur(18px);
      box-shadow: 0 14px 34px rgba(12, 18, 24, .15);
    }
    .tab {
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 17px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 850;
    }
    .tab.active { color: var(--chipText); background: var(--chip); }
    .mono .phone { --bg:#f5f8fa; --bgTop:#ffffff; --hero:#17242e; --hero2:#2e4657; --onHero:#f5fbff; --card:#ffffff; --card2:#f8fbfc; --border:#dfe8ee; --borderStrong:#c9d7df; --text:#15232d; --muted:#687983; --strong:#192f3e; --chip:#e5f4f7; --chipText:#17677a; --accent:#35b8ca; --button2:#91e4c1; --buttonText:#07171d; --nav:rgba(255,255,255,.9); }
    .neon .phone { --bg:#080f18; --bgTop:#0b2430; --hero:#0b2735; --hero2:#081018; --onHero:#eafeff; --card:rgba(15,31,42,.92); --card2:rgba(255,255,255,.055); --border:rgba(126,230,244,.16); --borderStrong:rgba(126,230,244,.23); --text:#eafeff; --muted:#8da7af; --strong:#85f5ff; --chip:rgba(96,230,255,.14); --chipText:#8df3ff; --accent:#7cf5ff; --button2:#a9ffbd; --buttonText:#061319; --nav:rgba(5,16,23,.9); }
    .pearl .phone { --bg:#f4f1ec; --bgTop:#fff8f3; --hero:#6e4e5a; --hero2:#8a6f5e; --onHero:#fff8f5; --card:rgba(255,255,255,.8); --card2:#fff8f2; --border:rgba(133,110,98,.16); --borderStrong:rgba(133,110,98,.22); --text:#2a2320; --muted:#7d6d66; --strong:#6e4e5a; --chip:#eee2dd; --chipText:#7a4c58; --accent:#b98091; --button2:#8fb58c; --buttonText:#fffaf8; --nav:rgba(255,255,255,.88); }
    .noir .phone { --bg:#15110f; --bgTop:#251c16; --hero:#2f261f; --hero2:#14100d; --onHero:#fff4e4; --card:rgba(48,38,31,.9); --card2:rgba(255,244,228,.06); --border:rgba(226,184,101,.17); --borderStrong:rgba(226,184,101,.28); --text:#fff4e4; --muted:#c8b69d; --strong:#e8c27a; --chip:rgba(226,184,101,.14); --chipText:#e9c987; --accent:#e2b865; --button2:#a87345; --buttonText:#17100c; --nav:rgba(22,17,14,.92); }
  </style>
</head>
<body>
  <main class="board">
    <section class="intro">
      <h1>微信小程序 UI 方向稿</h1>
      <p>保留现有信息结构：首页、关系详情、时间线、我的。以下是 4 套可选视觉方向。</p>
    </section>
    <div id="app"></div>
  </main>
  <script>
    const concepts = [
      { cls: "mono", name: "01 极简情报台", desc: "白底专业、克制冷感，适合长期使用和高信息密度。", colors: ["#f5f8fa", "#17242e", "#35b8ca", "#91e4c1"] },
      { cls: "neon", name: "02 冷感 AI 仪表盘", desc: "深色科技、信号网格、强数据感，最酷最有产品记忆点。", colors: ["#080f18", "#0b2735", "#7cf5ff", "#a9ffbd"] },
      { cls: "pearl", name: "03 珍珠疗愈系统", desc: "柔和但不幼稚，适合关系记录、情绪容纳和女性向质感。", colors: ["#f4f1ec", "#6e4e5a", "#b98091", "#8fb58c"] },
      { cls: "noir", name: "04 黑金夜间档案", desc: "私密、高级、有戏剧张力，适合作为夜间主题或高端默认风。", colors: ["#15110f", "#2f261f", "#e2b865", "#a87345"] }
    ];
    const screens = [
      {
        name: "首页",
        hero: ["Relationship Signal Lab", "优先追踪新的信号", "当前对象正在进入连续观察期，先记录事件，再看趋势变化。"],
        stats: [["意向", "72", "+8 本周"], ["推进", "中高", "稳定升温"], ["风险", "31", "轻微波动"]],
        body: "home"
      },
      {
        name: "关系详情",
        hero: ["Active Case", "关系主页面板", "把阶段、状态、风险和建议压缩到一眼能判断的结构里。"],
        stats: [["阶段", "试探", "可推进"], ["状态", "主动", "谨慎升温"], ["复盘", "4", "本周事件"]],
        body: "detail"
      },
      {
        name: "时间线",
        hero: ["Timeline", "证据链回放", "按时间看真实发生过的信号，而不是被情绪带着跑。"],
        stats: [["今日", "2", "新事件"], ["趋势", "+12", "意向变化"], ["AI", "已判", "含建议"]],
        body: "timeline"
      },
      {
        name: "我的",
        hero: ["Me / Settings", "我的与设置", "账号、主题、AI 能力和判断说明都放进清晰的设置面板。"],
        stats: [["对象", "3", "进行中"], ["主题", "4", "可切换"], ["AI", "ON", "研判开启"]],
        body: "me"
      }
    ];
    function statsHtml(items) {
      return `<div class="stats">${items.map(([a,b,c]) => `<div class="stat"><label>${a}</label><strong>${b}</strong><span>${c}</span></div>`).join("")}</div>`;
    }
    function bodyHtml(kind) {
      if (kind === "home") return `
        <section class="card"><div class="card-head"><div><span class="h2">即时判断</span><span class="muted">最近一条记录带来的系统结论</span></div><div class="chip-row"><span class="chip">AI 研判</span></div></div>
        <div class="two"><div class="item"><span class="label">状态</span><strong>主动但谨慎</strong></div><div class="item"><span class="label">建议</span><strong>轻推进一次</strong></div></div>
        <div class="input" style="margin-top:10px">他主动问了周末安排，但没有立刻确认时间...</div><div class="button">记录并分析</div></section>`;
      if (kind === "detail") return `
        <section class="card"><div class="card-head"><div><span class="h2">当前结论</span><span class="muted">把阶段和行动建议分开显示</span></div></div>
        <div class="two"><div class="item"><span class="label">别这样做</span><strong>连续追问确认</strong></div><div class="item"><span class="label">可以这样做</span><strong>轻松邀约一次</strong></div></div>
        <div class="chip-row" style="margin-top:12px"><span class="chip">稳定回复</span><span class="chip">主动开启话题</span><span class="chip">执行待观察</span></div></section>`;
      if (kind === "timeline") return `
        <section class="card"><div class="card-head"><div><span class="h2">最近事件</span><span class="muted">按影响排序展示关键记录</span></div></div>
        <div class="timeline"><div class="event"><div class="time">今天<br>21:30</div><div class="axis"></div><div class="event-card"><span class="event-title">主动问周末安排</span><span class="event-desc">意向 +8，风险无明显上升。</span></div></div>
        <div class="event"><div class="time">昨天<br>18:12</div><div class="axis"></div><div class="event-card"><span class="event-title">计划暂未落地</span><span class="event-desc">有兴趣，但需要继续观察执行。</span></div></div></div></section>`;
      return `
        <section class="card"><div class="profile"><div class="avatar">我</div><div><span class="h2">账号信息</span><span class="muted">当前登录账号与关系对象数量</span></div></div>
        <div class="rows"><div class="row"><span>界面风格</span><b>选择主题</b></div><div class="row"><span>AI 事件研判</span><b>已开启</b></div><div class="row"><span>数据与对象</span><b>对象列表</b></div><div class="row"><span>判断说明</span><b>查看规则</b></div></div></section>`;
    }
    function phoneHtml(screen, activeIndex) {
      return `<article class="phone"><div class="screen">
        <div class="status"><span>09:41</span><span>● ● ● ▭</span></div>
        <span class="screen-name">${screen.name}</span>
        <section class="hero"><span class="eyebrow">${screen.hero[0]}</span><span class="h1">${screen.hero[1]}</span><span class="copy">${screen.hero[2]}</span>${statsHtml(screen.stats)}</section>
        ${bodyHtml(screen.body)}
        <nav class="tabbar">${["首页","关系","时间线","案例","我的"].map((t,i)=>`<div class="tab ${i===activeIndex?"active":""}">${t}</div>`).join("")}</nav>
      </div></article>`;
    }
    document.getElementById("app").innerHTML = concepts.map(c => `
      <section class="concept ${c.cls}" id="${c.cls}">
        <div class="concept-head">
          <div class="concept-title"><div class="mark"></div><div><h2>${c.name}</h2><p class="concept-desc">${c.desc}</p></div></div>
          <div class="palette">${c.colors.map(x=>`<span class="swatch" style="background:${x}"></span>`).join("")}</div>
        </div>
        <div class="screens">${screens.map((s,i)=>phoneHtml(s, i === 1 ? 1 : i === 2 ? 2 : i === 3 ? 4 : 0)).join("")}</div>
      </section>
    `).join("");
  </script>
</body>
</html>
