<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>场景气泡图 UI 预览</title>
  <style>
    :root {
      --bg: #FFFDF5;
      --ink: #111;
      --muted: #666;
      --soft: #999;
      --hero: #FF6B6B;
      --yellow: #FFD93D;
      --mint: #4ECDC4;
      --mint-soft: #E0FFF0;
      --paper: #fff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f0ebe0;
      display: flex;
      justify-content: center;
      padding: 20px 0;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--ink);
    }

    .phone {
      width: 390px;
      min-height: 100vh;
      background: var(--bg);
      border: 2px solid var(--ink);
      padding: 18px;
    }

    .hero {
      background: var(--hero);
      border: 2px solid var(--ink);
      box-shadow: 3px 3px 0 var(--ink);
      padding: 24px;
      margin-bottom: 18px;
      transform: rotate(-.4deg);
    }

    .hero-tag {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 3px 10px;
      border: 1.5px solid var(--ink);
      background: var(--ink);
      color: var(--yellow);
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 2px;
    }

    .hero-title {
      display: block;
      margin-top: 14px;
      font-size: 38px;
      line-height: 1.08;
      font-weight: 900;
      letter-spacing: -1px;
    }

    .hero-copy {
      display: block;
      margin-top: 10px;
      color: rgba(0,0,0,.72);
      font-size: 15px;
      line-height: 1.5;
      font-weight: 700;
    }

    .block {
      background: var(--paper);
      border: 2px solid var(--ink);
      box-shadow: 3px 3px 0 var(--ink);
      padding: 18px;
      margin-bottom: 18px;
    }

    .block.mint { background: var(--mint-soft); }

    .section-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
      margin-bottom: 14px;
    }

    .section-title {
      display: block;
      font-size: 20px;
      line-height: 1.15;
      font-weight: 900;
    }

    .section-sub {
      display: block;
      margin-top: 5px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.35;
      font-weight: 800;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      border: 1.5px solid var(--ink);
      background: var(--paper);
      padding: 3px 10px;
      font-size: 11px;
      line-height: 1;
      font-weight: 900;
    }

    .tag.black { background: var(--ink); color: #fff; }
    .tag.yellow { background: var(--yellow); }
    .tag.mint { background: var(--mint); }

    .chart {
      position: relative;
      height: 320px;
      border: 2px solid var(--ink);
      background:
        radial-gradient(circle at 50% 50%, rgba(0,0,0,.02), rgba(0,0,0,0) 58%),
        linear-gradient(180deg, #fff, #fffcf4);
      overflow: hidden;
    }

    .axis-line {
      position: absolute;
      left: 14px;
      right: 14px;
      top: 50%;
      height: 2px;
      background: var(--ink);
      opacity: .55;
    }

    .axis-line.v {
      top: 14px;
      bottom: 14px;
      left: 50%;
      width: 2px;
      height: auto;
    }

    .axis-label {
      position: absolute;
      font-size: 10px;
      font-weight: 900;
      color: var(--soft);
      background: #fff;
      padding: 2px 5px;
    }

    .axis-label.top { top: 6px; left: 50%; transform: translateX(-50%); }
    .axis-label.right { right: 8px; top: 50%; transform: translateY(-50%); }
    .axis-label.left { left: 8px; top: 50%; transform: translateY(-50%); }
    .axis-label.bottom { bottom: 6px; left: 50%; transform: translateX(-50%); }

    .bubble {
      position: absolute;
      border: 2px solid var(--ink);
      border-radius: 50%;
      display: grid;
      place-items: center;
      text-align: center;
      font-weight: 900;
      line-height: 1.05;
      color: var(--ink);
      box-shadow: 2px 2px 0 rgba(17,17,17,.9);
    }

    .bubble span {
      display: block;
      font-size: 11px;
      line-height: 1.05;
    }

    .bubble small {
      display: block;
      margin-top: 2px;
      font-size: 10px;
      font-weight: 900;
      opacity: .72;
    }

    .b1 { width: 118px; height: 118px; left: 108px; top: 26px; background: var(--mint); }
    .b2 { width: 96px; height: 96px; left: 34px; top: 108px; background: var(--yellow); }
    .b3 { width: 88px; height: 88px; left: 214px; top: 118px; background: var(--yellow); }
    .b4 { width: 76px; height: 76px; left: 74px; top: 210px; background: #fff; }
    .b5 { width: 72px; height: 72px; left: 172px; top: 216px; background: #fff; }
    .b6 { width: 64px; height: 64px; left: 252px; top: 214px; background: #fff; }
    .b7 { width: 54px; height: 54px; left: 280px; top: 44px; background: #fff; }

    .legend-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    .legend {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1.5px solid var(--ink);
      background: #fff;
      padding: 4px 8px;
      font-size: 11px;
      font-weight: 900;
    }

    .legend i {
      width: 10px;
      height: 10px;
      border: 1.5px solid var(--ink);
      display: inline-block;
    }

    .legend i.mint { background: var(--mint); }
    .legend i.yellow { background: var(--yellow); }
    .legend i.white { background: #fff; }

    .scene-chips {
      margin-top: 14px;
      border: 2px solid var(--ink);
      background: #fff;
      padding: 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .scene-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 26px;
      border: 1.5px solid var(--ink);
      background: #fff;
      padding: 4px 8px;
      font-size: 12px;
      font-weight: 900;
    }

    .scene-chip.hot { background: var(--mint); }
    .scene-chip.mid { background: var(--yellow); }
    .scene-chip.more {
      background: repeating-linear-gradient(45deg, #fff, #fff 5px, #f1f1f1 5px, #f1f1f1 10px);
    }

    .scene-chip b {
      font-variant-numeric: tabular-nums;
      color: var(--ink);
    }
  </style>
</head>
<body>
  <main class="phone">
    <section class="hero">
      <span class="hero-tag">SCENE BUBBLE</span>
      <span class="hero-title">场景<br />气泡图</span>
      <span class="hero-copy">用气泡大小表现次数，顶部保留一个简单的 Top 统计，兼顾高级感和可读性。</span>
    </section>

    <section class="block mint">
      <div class="section-head">
        <div>
          <span class="section-title">场景分布</span>
          <span class="section-sub">气泡越大，出现次数越多</span>
        </div>
        <span class="tag black">Top 7</span>
      </div>

      <div class="chart">
        <div class="axis-line"></div>
        <div class="axis-line v"></div>
        <div class="axis-label top">少</div>
        <div class="axis-label bottom">多</div>
        <div class="axis-label left">线下 / 关系推进</div>
        <div class="axis-label right">线上 / 日常互动</div>

        <div class="bubble b1"><span>聊天</span><small>8</small></div>
        <div class="bubble b2"><span>吃饭</span><small>6</small></div>
        <div class="bubble b3"><span>电影</span><small>4</small></div>
        <div class="bubble b4"><span>咖啡</span><small>3</small></div>
        <div class="bubble b5"><span>散步</span><small>2</small></div>
        <div class="bubble b6"><span>朋友局</span><small>2</small></div>
        <div class="bubble b7"><span>旅行</span><small>1</small></div>
      </div>

      <div class="legend-row">
        <span class="legend"><i class="mint"></i>高频</span>
        <span class="legend"><i class="yellow"></i>中频</span>
        <span class="legend"><i class="white"></i>低频</span>
      </div>

      <div class="scene-chips">
        <span class="scene-chip hot">聊天 <b>8</b></span>
        <span class="scene-chip mid">吃饭 <b>6</b></span>
        <span class="scene-chip mid">电影 <b>4</b></span>
        <span class="scene-chip">咖啡 <b>3</b></span>
        <span class="scene-chip">散步 <b>2</b></span>
        <span class="scene-chip">朋友局 <b>2</b></span>
        <span class="scene-chip">旅行 <b>1</b></span>
        <span class="scene-chip more">其他 <b>3</b></span>
      </div>
    </section>
  </main>
</body>
</html>
