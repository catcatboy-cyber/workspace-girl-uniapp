<svg width="390" height="844" viewBox="0 0 390 844" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="390" height="844" fill="#FFFDF5"/>
  <rect x="18" y="18" width="354" height="96" fill="#FF6B6B" stroke="#111111" stroke-width="3"/>
  <rect x="26" y="26" width="114" height="24" fill="#111111"/>
  <text x="35" y="44" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="12" font-weight="700" fill="#FFD93D">命理桃花</text>
  <text x="28" y="80" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="30" font-weight="900" fill="#111111">今天适合怎么动？</text>
  <text x="28" y="102" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="13" font-weight="600" fill="#222222">先看你的桃花状态，再看你和 TA 的匹配。</text>

  <rect x="18" y="134" width="354" height="94" fill="#FFFFFF" stroke="#111111" stroke-width="3"/>
  <text x="32" y="160" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="15" font-weight="900" fill="#111111">今日桃花</text>
  <text x="308" y="160" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="28" font-weight="900" text-anchor="middle" fill="#111111">76</text>
  <text x="334" y="160" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="12" font-weight="700" fill="#777777">/100</text>
  <text x="32" y="188" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="15" font-weight="800" fill="#111111">适合轻推进，不适合逼问表态。</text>
  <text x="32" y="211" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="12" font-weight="600" fill="#777777">桃花方位：东南 · 今日关键词：自然升温</text>

  <rect x="18" y="246" width="354" height="274" fill="#FFFFFF" stroke="#111111" stroke-width="3"/>
  <rect x="18" y="246" width="354" height="8" fill="#FFD93D"/>
  <text x="32" y="280" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="16" font-weight="900" fill="#111111">你的桃花人设</text>
  <rect x="268" y="260" width="76" height="28" rx="0" fill="#111111"/>
  <text x="306" y="279" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="12" font-weight="800" text-anchor="middle" fill="#FFD93D">命理依据</text>
  <text x="32" y="322" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="34" font-weight="900" fill="#111111">慢热感受型</text>
  <text x="32" y="352" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="15" font-weight="700" fill="#333333">你更容易被稳定回应、持续行动和细节照顾打动。</text>

  <rect x="32" y="374" width="54" height="28" fill="#FFFBEB" stroke="#111111" stroke-width="2"/>
  <text x="59" y="393" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="12" font-weight="800" text-anchor="middle" fill="#111111">属兔</text>
  <rect x="94" y="374" width="66" height="28" fill="#FFFBEB" stroke="#111111" stroke-width="2"/>
  <text x="127" y="393" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="12" font-weight="800" text-anchor="middle" fill="#111111">双鱼座</text>
  <rect x="168" y="374" width="86" height="28" fill="#FFFBEB" stroke="#111111" stroke-width="2"/>
  <text x="211" y="393" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="12" font-weight="800" text-anchor="middle" fill="#111111">星次·鹑火</text>

  <text x="32" y="432" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="13" font-weight="900" fill="#111111">桃花关键词</text>
  <rect x="32" y="446" width="64" height="28" fill="#111111"/>
  <text x="64" y="465" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="12" font-weight="800" text-anchor="middle" fill="#FFFFFF">慢热</text>
  <rect x="104" y="446" width="78" height="28" fill="#111111"/>
  <text x="143" y="465" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="12" font-weight="800" text-anchor="middle" fill="#FFFFFF">细节敏感</text>
  <rect x="190" y="446" width="86" height="28" fill="#111111"/>
  <text x="233" y="465" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="12" font-weight="800" text-anchor="middle" fill="#FFFFFF">重安全感</text>

  <text x="32" y="498" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="13" font-weight="900" fill="#111111">适合推进方式</text>
  <text x="132" y="498" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="13" font-weight="700" fill="#555555">轻松自然地互动，不要高压试探。</text>

  <rect x="18" y="540" width="354" height="178" fill="#FFFBEB" stroke="#111111" stroke-width="3"/>
  <text x="32" y="574" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="16" font-weight="900" fill="#111111">桃花匹配度</text>
  <text x="32" y="604" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="13" font-weight="700" fill="#555555">你和当前 TA 的属相、星座与互动节奏组合。</text>
  <text x="32" y="658" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="44" font-weight="900" fill="#111111">72</text>
  <text x="92" y="657" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="13" font-weight="800" fill="#777777">匹配分</text>
  <text x="32" y="690" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="14" font-weight="800" fill="#111111">吸引力足，但节奏容易一快一慢。</text>
  <rect x="252" y="646" width="92" height="38" fill="#111111"/>
  <text x="298" y="670" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="14" font-weight="900" text-anchor="middle" fill="#FFD93D">更换 TA</text>

  <rect x="18" y="738" width="354" height="70" fill="#FFFFFF" stroke="#111111" stroke-width="3"/>
  <text x="32" y="768" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="14" font-weight="900" fill="#111111">命理依据弹层示意</text>
  <text x="32" y="792" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="12" font-weight="600" fill="#666666">点击“命理依据”后展示：生肖 / 中国星次 / 西方星座的详细解释。</text>
</svg>
