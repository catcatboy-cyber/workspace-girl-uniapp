<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Token 卡片 — 排版方案</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: #FFFDF5; color: #111; padding: 28px 18px; max-width: 420px; margin: 0 auto;
    font-family: -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    font-size: 15px;
  }
  .card {
    background: #fff; border: 3px solid #111; box-shadow: 6px 6px 0 #111; padding: 24px;
    margin-bottom: 20px;
  }
  .card-head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 14px;
  }
  .section-title {
    font-size: 16px; font-weight: 900; color: #111;
    text-transform: uppercase; letter-spacing: 1px;
  }
  .plan-badge {
    padding: 3px 12px; border: 2px solid #111; background: #4ECDC4;
    font-size: 12px; font-weight: 900; color: #111;
  }

  /* ── Balance Hero ── */
  .balance-hero {
    background: #FF6B6B; border: 3px solid #111; box-shadow: 4px 4px 0 #111;
    padding: 18px 22px; display: flex; align-items: baseline; gap: 8px;
    margin-bottom: 16px;
  }
  .balance-num {
    font-size: 30px; font-weight: 900; color: #111; line-height: 1;
    white-space: nowrap;
  }
  .balance-unit {
    font-size: 15px; font-weight: 700; color: rgba(0,0,0,0.55); flex-shrink: 0;
  }

  /* ── Stats: 2×2 Grid ── */
  .stats-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px;
  }
  .stat-box {
    padding: 14px 16px; border: 2px solid #111; background: #fafafa;
    display: flex; align-items: center; justify-content: space-between;
  }
  .stat-box .stat-num {
    font-size: 21px; font-weight: 900; color: #111; line-height: 1;
    white-space: nowrap;
  }
  .stat-box .stat-lbl {
    font-size: 13px; font-weight: 700; color: #999;
  }

  /* ── Voice: lightweight ── */
  .voice-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 0; border-top: 1px solid rgba(0,0,0,0.08);
    font-size: 13px; font-weight: 600; color: #999;
  }

  /* ── Buttons ── */
  .btn-row {
    display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap;
  }
  .btn {
    flex: 1; min-width: 0; height: 36px; line-height: 36px;
    font-size: 13px; font-weight: 800; text-align: center;
    border: 2px solid #111; background: #fff; color: #111;
    padding: 0 8px; cursor: pointer; white-space: nowrap;
  }
  .btn.primary { background: #4ECDC4; }
  .btn.ghost { background: transparent; border-style: dashed; }
</style>
</head>
<body>

<!-- BEFORE: current 4-col cramped -->
<div class="card" style="margin-bottom:12px;">
  <div style="font-size:11px;color:#999;font-weight:900;margin-bottom:10px;text-transform:uppercase;letter-spacing:2px;">当前 · 4列挤变形</div>
  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px;">
    <div style="padding:10px 4px;border:2px solid #111;background:#f9f9f9;text-align:center;">
      <div style="font-size:16px;font-weight:900;">∞</div>
      <div style="font-size:11px;font-weight:700;color:#666;">本月套餐</div>
    </div>
    <div style="padding:10px 4px;border:2px solid #111;background:#f9f9f9;text-align:center;">
      <div style="font-size:16px;font-weight:900;">1500</div>
      <div style="font-size:11px;font-weight:700;color:#666;">加油包</div>
    </div>
    <div style="padding:10px 4px;border:2px solid #111;background:#f9f9f9;text-align:center;">
      <div style="font-size:14px;font-weight:900;">320/∞</div>
      <div style="font-size:11px;font-weight:700;color:#666;">已用/上限</div>
    </div>
    <div style="padding:10px 4px;border:2px solid #111;background:#f9f9f9;text-align:center;">
      <div style="font-size:16px;font-weight:900;">2</div>
      <div style="font-size:11px;font-weight:700;color:#666;">已邀请</div>
    </div>
  </div>
  <div style="display:flex;justify-content:space-between;padding:10px 14px;border:2px solid #111;background:#fff;font-size:14px;font-weight:900;color:#111;margin-bottom:10px;">
    <span>语音识别</span><span style="font-weight:700;">23 次 · 累计 08:15</span>
  </div>
  <div style="font-size:11px;color:#FF5252;font-weight:900;text-align:center;margin-top:4px;">↑ 太挤，字重太重</div>
</div>

<!-- AFTER: 2×2 relaxed layout -->
<div class="card">
  <div class="card-head">
    <span class="section-title">Token</span>
    <span class="plan-badge">✦ PRO</span>
  </div>

  <!-- Balance -->
  <div class="balance-hero">
    <span class="balance-num">4,500</span>
    <span class="balance-unit">Token 可用</span>
  </div>

  <!-- Stats 2×2 -->
  <div class="stats-grid">
    <div class="stat-box">
      <span class="stat-num">∞</span>
      <span class="stat-lbl">本月套餐</span>
    </div>
    <div class="stat-box">
      <span class="stat-num">1,500</span>
      <span class="stat-lbl">加油包</span>
    </div>
    <div class="stat-box">
      <span class="stat-num">320 / ∞</span>
      <span class="stat-lbl">已用 / 上限</span>
    </div>
    <div class="stat-box">
      <span class="stat-num">2</span>
      <span class="stat-lbl">已邀请</span>
    </div>
  </div>

  <!-- Voice: light -->
  <div class="voice-row">
    <span>语音识别</span>
    <span>23 次 · 累计 08:15</span>
  </div>

  <!-- Buttons -->
  <div class="btn-row">
    <button class="btn primary">升级套餐</button>
    <button class="btn">买加油包</button>
    <button class="btn">+3,000</button>
    <button class="btn ghost">消费明细</button>
  </div>
</div>

</body>
</html>
