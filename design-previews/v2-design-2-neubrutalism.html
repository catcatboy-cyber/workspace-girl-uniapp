<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>方案二：硬边海报 — Neubrutalism × 粗野新潮</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  background: #f0ebe0;
  display: flex; justify-content: center; padding: 20px 0;
}
.phone {
  width: 390px; min-height: 100vh;
  background: #FFFDF7;
  padding: 20px;
  border: 3px solid #000;
}

/* === Neubrutalist blocks === */
.block {
  background: #fff;
  border: 3px solid #000;
  box-shadow: 5px 5px 0 #000;
  margin-bottom: 18px;
}
.block.yellow { background: #FFEB3B; }
.block.pink  { background: #FFE0E5; }
.block.mint  { background: #E0FFF0; }
.block.blue  { background: #E0F0FF; }

/* Hero — big yellow block */
.hero-block {
  padding: 24px; position: relative;
}
.hero-block .tag {
  display: inline-block; background: #000; color: #fff; padding: 3px 10px;
  font-size: 10px; font-weight: 800; letter-spacing: 2px; margin-bottom: 12px;
}
.hero-block .h1 {
  font-size: 36px; font-weight: 900; color: #000; line-height: 1.1;
  display: block; margin-bottom: 8px; letter-spacing: -1px;
}
.hero-block .sub {
  font-size: 14px; color: #333; line-height: 1.5; display: block;
}

/* KPI as big numbers in a row */
.kpi-strip {
  display: flex; border-top: 3px solid #000; border-bottom: 3px solid #000;
}
.kpi-strip .kpi {
  flex: 1; text-align: center; padding: 14px 8px;
  border-right: 3px solid #000;
}
.kpi-strip .kpi:last-child { border-right: none; }
.kpi-strip .kpi .num {
  font-size: 34px; font-weight: 900; display: block; line-height: 1; color: #000;
}
.kpi-strip .kpi .lbl {
  font-size: 10px; font-weight: 700; display: block; margin-top: 4px; color: #555;
}

/* Pills — hard bordered */
.pill-row { display: flex; flex-wrap: wrap; gap: 6px; padding: 14px 24px; }
.pill-h {
  padding: 4px 10px; border: 2px solid #000; font-size: 11px; font-weight: 700;
  background: #fff;
}
.pill-h.black { background: #000; color: #fff; }

/* Quick record block */
.record-block { padding: 20px; }
.record-block .h2 {
  font-size: 20px; font-weight: 800; color: #000; display: block; margin-bottom: 4px;
}
.record-block .muted { font-size: 12px; color: #666; display: block; }
.textarea-hard {
  width: 100%; min-height: 80px; padding: 12px; margin-top: 10px;
  background: #fff; border: 3px solid #000; font-size: 14px; color: #000;
  resize: none; font-family: inherit;
}
.textarea-hard::placeholder { color: #aaa; }
.textarea-hard:focus { outline: none; box-shadow: 3px 3px 0 #000; }

/* Buttons */
.btn-row { display: flex; gap: 8px; margin-top: 12px; }
.btn-hard {
  flex: 1; height: 44px; line-height: 44px; text-align: center;
  background: #fff; border: 3px solid #000; font-size: 14px; font-weight: 800;
  cursor: pointer;
}
.btn-hard:hover { box-shadow: 3px 3px 0 #000; }
.btn-hard.black { background: #000; color: #fff; }
.btn-hard:hover.black { box-shadow: 3px 3px 0 #666; }

/* Score bars */
.score-block { padding: 18px; }
.score-row { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
.score-num { font-size: 26px; font-weight: 900; color: #000; width: 40px; line-height: 1; }
.score-tag { font-size: 9px; font-weight: 700; color: #666; width: 50px; }
.score-bar {
  flex: 1; height: 10px; border: 2px solid #000; background: #fff; position: relative;
}
.score-fill {
  height: 100%; position: absolute; left: 0; top: 0;
}
.score-fill.high { width: 68%; background: #000; }
.score-fill.mid  { width: 32%; background: repeating-linear-gradient(45deg, #000, #000 3px, #fff 3px, #fff 8px); }

/* Feedback card */
.feedback-block { padding: 20px; }
.feedback-block .title {
  font-size: 16px; font-weight: 800; color: #000; display: block; margin-bottom: 12px;
}

/* Spec card */
.spec-card {
  background: #fff; border: 3px solid #000; box-shadow: 5px 5px 0 #000;
  padding: 18px; margin-top: 6px;
}
.spec-card .st { font-size: 14px; font-weight: 900; color: #000; margin-bottom: 8px; display: block; }
.spec-card .sr { display: flex; justify-content: space-between; padding: 3px 0; font-size: 11px; font-weight: 600; color: #555; }
.spec-card .sr span:last-child { color: #000; }
.color-strip { display: flex; gap: 6px; margin-bottom: 12px; }
.color-dot { width: 28px; height: 28px; border: 2px solid #000; }

/* Tab bar */
.tab-bar {
  display: flex; justify-content: space-around; padding: 14px 8px 0; margin-top: 6px;
  border-top: 3px solid #000;
}
.tab { text-align: center; font-size: 10px; font-weight: 800; color: #999; }
.tab.active { color: #000; }
.tab .dot { width: 10px; height: 10px; border: 2px solid #000; margin: 0 auto 4px; background: #fff; }
.tab.active .dot { background: #000; }
</style>
</head>
<body>
<div class="phone">

  <!-- Hero -->
  <div class="block yellow hero-block">
    <span class="tag">CURRENT</span>
    <span class="h1">小陈</span>
    <span class="sub">最近记录 5/18 · 12 条时间线 · 3 个关系对象</span>

    <div class="kpi-strip" style="margin:16px -24px 0;">
      <div class="kpi"><span class="num">68</span><span class="lbl">意向分</span></div>
      <div class="kpi"><span class="num">32</span><span class="lbl">风险分</span></div>
      <div class="kpi"><span class="num">12</span><span class="lbl">事件</span></div>
    </div>

    <div class="pill-row">
      <span class="pill-h black">中高意向</span>
      <span class="pill-h">偏低风险</span>
      <span class="pill-h">26岁·男·设计师</span>
      <span class="pill-h">属虎</span>
      <span class="pill-h">天蝎座</span>
    </div>
  </div>

  <!-- Quick Record -->
  <div class="block pink record-block">
    <span class="h2">快速记录</span>
    <span class="muted">一句话记到小陈的时间线</span>
    <textarea class="textarea-hard" placeholder="他今天主动约我吃饭，提前把时间地点都定好了。"></textarea>
    <div class="btn-row">
      <div class="btn-hard">图片</div>
      <div class="btn-hard">语音</div>
    </div>
    <div class="btn-row">
      <div class="btn-hard black">保存到最近对象</div>
    </div>
  </div>

  <!-- Feedback -->
  <div class="block mint feedback-block">
    <span class="title">最新反馈：他主动约周末见面</span>
    <div class="pill-row" style="padding:0;">
      <span class="pill-h">推进事件</span>
      <span class="pill-h black">观察期</span>
      <span class="pill-h">稳步推进</span>
    </div>
    <div class="score-block" style="padding:12px 0;">
      <div class="score-row">
        <span class="score-num">68</span>
        <span class="score-tag">意向</span>
        <div class="score-bar"><div class="score-fill high"></div></div>
      </div>
      <div class="score-row">
        <span class="score-num">32</span>
        <span class="score-tag">风险</span>
        <div class="score-bar"><div class="score-fill mid"></div></div>
      </div>
    </div>
    <div class="btn-row"><div class="btn-hard">查看主页</div></div>
  </div>

  <!-- Specs -->
  <div class="spec-card">
    <div class="color-strip">
      <div class="color-dot" style="background:#FFEB3B"></div>
      <div class="color-dot" style="background:#FFE0E5"></div>
      <div class="color-dot" style="background:#E0FFF0"></div>
      <div class="color-dot" style="background:#000"></div>
      <div class="color-dot" style="background:#fff"></div>
    </div>
    <span class="st">设计规范 · 硬边海报</span>
    <div class="sr"><span>风格源</span><span>Neubrutalism</span></div>
    <div class="sr"><span>特征</span><span>3px黑边 · 5px硬影 · 纯色块</span></div>
    <div class="sr"><span>圆角</span><span>0px 直角</span></div>
    <div class="sr"><span>字重</span><span>800-900 极粗</span></div>
  </div>

  <div class="tab-bar">
    <div class="tab active"><div class="dot"></div>首页</div>
    <div class="tab"><div class="dot"></div>关系</div>
    <div class="tab"><div class="dot"></div>时间轴</div>
    <div class="tab"><div class="dot"></div>案例</div>
    <div class="tab"><div class="dot"></div>我的</div>
  </div>
  <div style="text-align:center; padding:12px 0 24px; font-size:10px; font-weight:700; color:#ccc;">UI UX Pro Max · Design 2 · Neubrutalism</div>
</div>
</body>
</html>
