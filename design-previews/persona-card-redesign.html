<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>桃花人设 — 排版方案</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: #FFFDF5; color: #111; padding: 28px 18px; max-width: 420px; margin: 0 auto;
    font-family: -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  }
  .card {
    background: #fff; border: 3px solid #111; box-shadow: 6px 6px 0 #111; padding: 26px;
    margin-bottom: 20px;
  }
  .title-row {
    display: flex; align-items: center; gap: 10px; margin-bottom: 20px;
  }
  .title-row .title {
    font-size: 17px; font-weight: 900; text-transform: uppercase; letter-spacing: 1px;
  }
  .share-btn {
    margin-left: auto; width: 24px; height: 24px;
    border: 2px solid #111; background: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 900; cursor: pointer;
  }

  /* ── Header Avatar ── */
  .persona-head {
    display: flex; align-items: center; gap: 14px; margin-bottom: 20px;
  }
  .zodiac-circle {
    width: 60px; height: 60px; border-radius: 50%;
    border: 3px solid #111; background: #FFD93D;
    display: flex; align-items: center; justify-content: center;
    font-size: 28px; flex-shrink: 0;
  }
  .persona-name {
    font-size: 20px; font-weight: 900; color: #111; display: block;
  }
  .persona-sub {
    font-size: 13px; font-weight: 600; color: #999; margin-top: 2px; display: block;
  }
  .relation-badge {
    display: inline-block; padding: 2px 10px; border: 2px solid #111;
    font-size: 12px; font-weight: 900; margin-top: 3px;
  }
  .badge-he { background: #FFD93D; color: #111; }
  .badge-chong { background: #FF5252; color: #fff; }
  .badge-ping { background: #fff; color: #666; }

  /* ── Two-Column Dim Cards ── */
  .dim-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px;
  }
  .dim-card {
    border: 2px solid #111; padding: 16px;
  }
  .dim-card .dim-icon { font-size: 16px; margin-bottom: 6px; display: block; }
  .dim-card .dim-label {
    font-size: 11px; font-weight: 900; color: #999;
    text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; display: block;
  }
  .dim-card .dim-body {
    font-size: 14px; font-weight: 600; color: #111; line-height: 1.45;
  }
  .dim-card .dim-src {
    font-size: 11px; font-weight: 600; color: #999; margin-top: 4px; display: block;
  }
  .dim-card .dim-tags {
    display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px;
  }
  .dim-chip {
    padding: 2px 8px; border: 2px solid #111; background: #FFFBEB;
    font-size: 12px; font-weight: 700; white-space: nowrap;
  }

  /* ── Best Match ── */
  .best-section { margin-top: 4px; }
  .best-label {
    font-size: 11px; font-weight: 900; color: #999;
    text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; display: block;
  }
  .best-tags {
    display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
  }
  .best-tag {
    padding: 4px 12px; border: 2px solid #111; background: #111; color: #fff;
    font-size: 13px; font-weight: 700;
  }
  .best-reason {
    font-size: 12px; font-weight: 600; color: #999; margin-top: 6px; display: block; line-height: 1.5;
  }

  .divider {
    border: none; border-top: 2px solid #111; margin: 16px 0; opacity: 0.1;
  }
</style>
</head>
<body>

<div class="card">
  <!-- Title -->
  <div class="title-row">
    <span class="title">你的桃花人设</span>
    <span class="share-btn">↗</span>
  </div>

  <!-- Header: Zodiac Avatar + Name -->
  <div class="persona-head">
    <div class="zodiac-circle">🐰</div>
    <div>
      <span class="persona-name">兔 · 双鱼座</span>
      <span class="persona-sub">大火（卯·木·阴）· 2月19日－3月20日</span>
      <span class="relation-badge badge-he">六合（大吉）</span>
    </div>
  </div>

  <!-- Two-Column: 中国星次 + 西方星座 -->
  <div class="dim-grid">
    <!-- 中国星次 -->
    <div class="dim-card">
      <span class="dim-icon">🌏</span>
      <span class="dim-label">中国星次</span>
      <span class="dim-body">气质温和、善解人意，细腻但容易陷入自我怀疑。正印星余气带来舒适包容的能量。</span>
      <span class="dim-src">《汉书·律历志》</span>
    </div>

    <!-- 西方星座 -->
    <div class="dim-card">
      <span class="dim-icon">🌍</span>
      <span class="dim-label">西方星座</span>
      <span class="dim-body">海王星守护 · 水象变动</span>
      <span class="dim-body" style="margin-top:4px;color:#666;">"浪漫、敏感，共情力强"</span>
      <div class="dim-tags">
        <span class="dim-chip">海王星</span>
        <span class="dim-chip">水象</span>
        <span class="dim-chip">变动</span>
      </div>
      <span class="dim-src">Ptolemy, Tetrabiblos</span>
    </div>
  </div>

  <!-- Best Match -->
  <div class="best-section">
    <span class="best-label">高频适配</span>
    <div class="best-tags">
      <span class="best-tag">♋ 巨蟹</span>
      <span class="best-tag">♏ 天蝎</span>
      <span class="best-tag">♑ 摩羯</span>
    </div>
    <span class="best-reason">巨蟹和天蝎能理解双鱼的深层情绪，摩羯提供稳定性。同属水象，容易建立情感共鸣。</span>
  </div>
</div>

</body>
</html>
