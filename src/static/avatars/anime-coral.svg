<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="hair-coral" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0a08a"/>
      <stop offset="100%" style="stop-color:#e8806a"/>
    </linearGradient>
  </defs>
  <!-- face -->
  <circle cx="100" cy="110" r="55" fill="#fce4cc"/>
  <!-- hair back -->
  <ellipse cx="100" cy="78" rx="63" ry="48" fill="url(#hair-coral)"/>
  <!-- wavy curls -->
  <path d="M48 88 Q42 115 46 145" stroke="url(#hair-coral)" fill="url(#hair-coral)" stroke-width="16" stroke-linecap="round"/>
  <path d="M152 88 Q158 115 154 145" stroke="url(#hair-coral)" fill="url(#hair-coral)" stroke-width="16" stroke-linecap="round"/>
  <!-- bangs -->
  <ellipse cx="78" cy="66" rx="42" ry="24" fill="url(#hair-coral)"/>
  <ellipse cx="122" cy="64" rx="38" ry="22" fill="url(#hair-coral)"/>
  <!-- eyes -->
  <ellipse cx="82" cy="108" rx="8" ry="9" fill="#3a2a1a"/>
  <ellipse cx="118" cy="108" rx="8" ry="9" fill="#3a2a1a"/>
  <circle cx="84" cy="105" r="2.5" fill="#fff"/>
  <circle cx="120" cy="105" r="2.5" fill="#fff"/>
  <!-- mouth -->
  <path d="M90 128 Q100 138 110 128" stroke="#d4956a" fill="none" stroke-width="2.5" stroke-linecap="round"/>
</svg>
