<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="hair-sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7eb8da"/>
      <stop offset="100%" style="stop-color:#5a9fc4"/>
    </linearGradient>
  </defs>
  <!-- face -->
  <circle cx="100" cy="110" r="55" fill="#fce4cc"/>
  <!-- hair back (long) -->
  <ellipse cx="100" cy="75" rx="62" ry="48" fill="url(#hair-sky)"/>
  <!-- wavy side hair -->
  <path d="M45 90 Q38 120 42 155 Q45 165 50 160" stroke="url(#hair-sky)" fill="url(#hair-sky)" stroke-width="18" stroke-linecap="round"/>
  <path d="M155 90 Q162 120 158 155 Q155 165 150 160" stroke="url(#hair-sky)" fill="url(#hair-sky)" stroke-width="18" stroke-linecap="round"/>
  <!-- bangs -->
  <ellipse cx="85" cy="65" rx="38" ry="24" fill="url(#hair-sky)"/>
  <ellipse cx="115" cy="63" rx="34" ry="22" fill="url(#hair-sky)"/>
  <!-- eyes -->
  <ellipse cx="82" cy="108" rx="8" ry="9" fill="#3a2a1a"/>
  <ellipse cx="118" cy="108" rx="8" ry="9" fill="#3a2a1a"/>
  <circle cx="84" cy="105" r="2.5" fill="#fff"/>
  <circle cx="120" cy="105" r="2.5" fill="#fff"/>
  <!-- mouth -->
  <path d="M90 128 Q100 138 110 128" stroke="#d4956a" fill="none" stroke-width="2.5" stroke-linecap="round"/>
</svg>
