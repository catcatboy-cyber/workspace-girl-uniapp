<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="hair-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8b878"/>
      <stop offset="100%" style="stop-color:#d4a050"/>
    </linearGradient>
  </defs>
  <!-- face -->
  <circle cx="100" cy="110" r="55" fill="#fce4cc"/>
  <!-- hair back -->
  <ellipse cx="100" cy="78" rx="62" ry="46" fill="url(#hair-amber)"/>
  <!-- straight bangs -->
  <rect x="45" y="55" width="110" height="20" rx="8" fill="url(#hair-amber)"/>
  <!-- bangs detail -->
  <ellipse cx="80" cy="64" rx="35" ry="18" fill="url(#hair-amber)"/>
  <ellipse cx="120" cy="64" rx="35" ry="18" fill="url(#hair-amber)"/>
  <!-- eyes -->
  <ellipse cx="82" cy="108" rx="8" ry="9" fill="#3a2a1a"/>
  <ellipse cx="118" cy="108" rx="8" ry="9" fill="#3a2a1a"/>
  <circle cx="84" cy="105" r="2.5" fill="#fff"/>
  <circle cx="120" cy="105" r="2.5" fill="#fff"/>
  <!-- mouth -->
  <path d="M90 128 Q100 138 110 128" stroke="#d4956a" fill="none" stroke-width="2.5" stroke-linecap="round"/>
</svg>
